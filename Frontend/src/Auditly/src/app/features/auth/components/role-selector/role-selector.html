<fieldset class="roles" [disabled]="disabled()">
  <legend class="roles__legend">{{ legend() }}</legend>

  <div class="roles__grid">
    @for (option of options; track option.value) {
      <label class="role" [class.role--active]="role() === option.value">
        <input
          type="radio"
          class="role__input sr-only"
          [name]="name()"
          [value]="option.value"
          [checked]="role() === option.value"
          (change)="role.set(option.value)"
        />
        <app-icon class="role__icon" [name]="option.icon" [size]="18" />
        <span class="role__label">{{ option.label }}</span>
        <span class="role__dot" aria-hidden="true"></span>
      </label>
    }
  </div>
</fieldset>
