<app-input-field
  icon="lock"
  [fieldId]="fieldId()"
  [label]="label()"
  [type]="visible() ? 'text' : 'password'"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [error]="error()"
  [disabled]="disabled()"
  [(value)]="value"
  (blurred)="blurred.emit()"
>
  <button
    fieldSuffix
    type="button"
    class="toggle"
    [attr.aria-label]="visible() ? 'Jelszó elrejtése' : 'Jelszó megjelenítése'"
    [attr.aria-pressed]="visible()"
    [attr.aria-controls]="fieldId()"
    [disabled]="disabled()"
    (click)="toggleVisibility()"
  >
    <app-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="18" />
  </button>
</app-input-field>
